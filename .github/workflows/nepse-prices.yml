name: NEPSE price feed

on:
  schedule:
    # Every 15 min, 05:00–09:45 UTC = 10:45–15:30 Nepal time, Sun–Thu (GitHub may delay scheduled runs a few minutes)
    - cron: "*/15 5-9 * * 0-4"
  workflow_dispatch: {}   # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: nepse-prices
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NEPSE client
        run: pip install --quiet "git+https://github.com/basic-bgnr/NepseUnofficialApi"
      - name: Fetch prices from nepalstock.com
        run: python fetch_prices.py
      - name: Commit prices.json
        run: |
          git config user.name "nepse-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet && echo "nothing to commit" || (git commit -m "prices $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
